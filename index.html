<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Локальный ИИ-чат</title>
<style>
:root{--bg:#f3f1ec;--ink:#1d2320;--mut:#6b746f;--me:#1f4d3f;--bot:#fff;--ln:#d9d5cb}
@media(prefers-color-scheme:dark){:root{--bg:#14181a;--ink:#e6ebe8;--mut:#8b9691;--me:#2d6b57;--bot:#20272a;--ln:#2c3538}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:12px 16px;border-bottom:1px solid var(--ln)}
h1{font-size:18px;margin:0}
#st{color:var(--mut);font:13px system-ui,sans-serif;margin-top:2px}
#bar{height:3px;background:var(--ln);margin-top:8px}#bar i{display:block;height:100%;width:0;background:var(--me)}
#ctl{display:flex;gap:8px;margin-top:8px}
select,button,input{font:15px system-ui,sans-serif;border:1px solid var(--ln);background:var(--bot);color:var(--ink);padding:8px 12px;border-radius:10px}
select{flex:1;min-width:0}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--bot);border:1px solid var(--ln);border-bottom-left-radius:4px}
#f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ln)}
input{flex:1;font-size:16px;min-width:0}
button:disabled,input:disabled{opacity:.5}
</style></head><body>
<header><h1>Локальный ИИ-чат</h1>
<div id="st">Выбери модель и нажми «Загрузить»</div><div id="bar"><i></i></div>
<div id="ctl"><select id="mod">
<option value="SmolLM2-360M-Instruct-q4f16_1-MLC">Лёгкая (360M, ~0.4 ГБ)</option>
<option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC" selected>Средняя (Qwen 0.5B, ~0.5 ГБ)</option>
<option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Умная (Qwen 1.5B, ~1.2 ГБ)</option>
</select><button id="load">Загрузить</button></div></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Напиши что-нибудь…" autocomplete="off" disabled><button id="go" disabled>Отправить</button></form>
<script type="module">
const $=id=>document.getElementById(id),log=$("log"),st=$("st"),bar=document.querySelector("#bar i");
const add=(t,c)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
const SYS="Ты умный, дружелюбный ассистент. Отвечай на языке пользователя (по умолчанию по-русски), понятно и по делу. Если не знаешь — честно скажи.";
let engine=null,wl=null,hist=[],busy=false;
add("Привет! Это настоящая языковая модель, она работает прямо на твоём устройстве. Выбери модель и нажми «Загрузить». Первый раз она скачается (нужен интернет), потом сохранится в браузере.","b");
async function setup(){
  let persist=true;
  try{await caches.open("t");if(!/^https?:|^file:/.test(location.protocol))throw 0}catch(_){persist=false}
  if(!persist){
    const mem=new Map(),k=r=>typeof r==="string"?r:r.url;
    const c={match:async r=>{const v=mem.get(k(r));return v?new Response(v.b,{headers:v.h}):undefined},
      put:async(r,x)=>{mem.set(k(r),{b:await x.clone().arrayBuffer(),h:[...x.headers]})},
      add:async r=>{const x=await fetch(k(r));if(!x.ok)throw new Error("HTTP "+x.status);mem.set(k(r),{b:await x.arrayBuffer(),h:[...x.headers]})},
      delete:async r=>mem.delete(k(r)),keys:async()=>[...mem.keys()].map(u=>new Request(u))};
    Object.defineProperty(window,"caches",{configurable:true,value:{open:async()=>c,has:async()=>true,delete:async()=>true,keys:async()=>[]}});
    add("Нет постоянного хранилища: модель загрузится в память. Для сохранения открой страницу в Safari или Chrome.","b");
  }
  wl=await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm");
}
async function loadModel(){
  $("q").disabled=$("go").disabled=true;
  try{if(engine)await engine.unload()}catch(_){}
  engine=null;
  const id=$("mod").value;
  const cfg={...wl.prebuiltAppConfig,useIndexedDBCache:false};
  engine=await wl.CreateMLCEngine(id,{appConfig:cfg,initProgressCallback:r=>{st.textContent=r.text;bar.style.width=(r.progress*100)+"%"}},{context_window_size:2048});
  st.textContent="Готово. Модель работает на твоём устройстве.";bar.style.width="100%";
  $("q").disabled=$("go").disabled=false;
}
$("load").onclick=async()=>{
  if(!navigator.gpu){add("Этот браузер не поддерживает WebGPU. Открой в Chrome (ПК/Android) или Safari (iOS 26+).","b");return}
  $("load").disabled=$("mod").disabled=true;
  try{await setup();await loadModel();$("q").focus()}
  catch(e){add("Ошибка при загрузке:\n"+(e.name||"Error")+": "+(e.message||e)+"\n\nПротокол: "+location.protocol,"b");st.textContent="Ошибка загрузки"}
  $("load").disabled=$("mod").disabled=false;
};
async function send(e){
  e&&e.preventDefault();const t=$("q").value.trim();if(!t||!engine||busy)return;
  busy=true;$("q").value="";add(t,"u");
  const d=add("…","b");let out="";
  const msgs=()=>[{role:"system",content:SYS},...hist.slice(-6),{role:"user",content:t}];
  try{
    const s=await engine.chat.completions.create({messages:msgs(),stream:true,temperature:.7,max_tokens:350});
    for await(const c of s){out+=c.choices[0]?.delta?.content||"";d.textContent=out;log.scrollTop=log.scrollHeight}
    hist.push({role:"user",content:t},{role:"assistant",content:out});
  }catch(err){
    d.textContent="Модель сбилась (скорее всего не хватило памяти телефона). Перезагружаю её, это займёт несколько секунд…";
    try{await loadModel();d.textContent="Модель перезагружена. Повтори вопрос. Если ошибка повторяется, выбери «Лёгкую» модель.";hist=[]}
    catch(e2){d.textContent="Не удалось перезагрузить: "+(e2.message||e2)+". Обнови страницу."}
  }
  busy=false;
}
$("f").addEventListener("submit",send);
</script></body></html>
